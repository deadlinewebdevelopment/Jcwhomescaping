<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCW Pest Control & Landscaping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVIGATION -->

    <nav class="navbar">
        <div class="container">

            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="JCW Logo">
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </div>
    </nav>

    <!-- HERO SLIDESHOW -->

    <section class="hero">

        <div class="slide active">
            <img src="images/pestcontrol.png" alt="Pest Control">
        </div>

        <div class="slide">
            <img src="images/landscaping.png" alt="Landscaping">
        </div>

        <div class="slide">
            <img src="images/completecare.png" alt="Complete Care">
        </div>

        <div class="overlay"></div>

        <div class="hero-content">
            <h1>JCW Pest Control & Landscaping</h1>

            <p>
                Professional Pest Control & Landscaping
            </p>

            <p class="subtext">
                Licensed • Insured • Free Estimates
            </p>

            <a href="contact.html" class="btn">
                GET A FREE QUOTE
            </a>
        </div>

    </section>

    <script>

        const slides = document.querySelectorAll('.slide');
        let current = 0;

        setInterval(() => {

            slides[current].classList.remove('active');

            current = (current + 1) % slides.length;

            slides[current].classList.add('active');

        }, 5000);

    </script>

</body>
</html>
