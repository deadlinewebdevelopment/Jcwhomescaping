<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCW Pest Control & Landscaping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO SLIDESHOW -->

    <section class="hero-slider">

        <div class="slide active">
            <img src="images/pestcontrol.png" alt="Pest Control">
        </div>

        <div class="slide">
            <img src="images/landscaping.png" alt="Landscaping">
        </div>

        <div class="slide">
            <img src="images/completecare.png" alt="Complete Care">
        </div>

    </section>

    <!-- TEXT BELOW SLIDESHOW -->

    <section class="hero-info">

        <img src="images/logo.png" alt="JCW Logo" class="hero-logo">

        <h1>JCW Pest Control & Landscaping</h1>

        <p>Licensed • Insured • Exceptional Service</p>

        <a href="#" class="btn">Get A Free Quote</a>

    </section>

    <script>

    const slides = document.querySelectorAll('.slide');
    let current = 0;

    setInterval(() => {

        slides[current].classList.remove('active');

        current = (current + 1) % slides.length;

        slides[current].classList.add('active');

    }, 5000);

    </script>

</body>
</html>
